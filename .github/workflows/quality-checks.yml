name: Portal Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tests, build and secret scans
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Scan repository for credentials and local artifacts
        run: npm run scan:repository

      - name: Lint
        run: npm run lint

      - name: Run offline fixtures and regressions
        run: npm test

      - name: Build frontend
        run: npm run build
        env:
          # Inert build-only values. This bundle is never deployed.
          VITE_SUPABASE_URL: https://ci-placeholder.invalid
          VITE_SUPABASE_ANON_KEY: ci-placeholder-not-a-credential

      - name: Scan frontend source and generated bundle
        run: npm run scan:frontend
